steps:
  - name: hashicorp/terraform:1.6.6
    id: terraform-init
    dir: infra
    entrypoint: sh
    args:
      - -c
      - |
        terraform init \
          -backend-config="bucket=${_TF_STATE_BUCKET}" \
          -backend-config="prefix=${_TF_STATE_PREFIX}"

  - name: hashicorp/terraform:1.6.6
    id: terraform-plan
    dir: infra
    entrypoint: sh
    args:
      - -c
      - terraform plan -var="project_id=${PROJECT_ID}" -out=tfplan

  - name: hashicorp/terraform:1.6.6
    id: terraform-apply-main-only
    dir: infra
    entrypoint: sh
    args:
      - -c
      - |
        if [ "${BRANCH_NAME}" = "main" ]; then
          echo "Main branch detected -> terraform apply"
          terraform apply -auto-approve tfplan
        else
          echo "Branch ${BRANCH_NAME} detected -> skipping terraform apply"
        fi

substitutions:
  _TF_STATE_BUCKET: retail-etl-tfstate
  _TF_STATE_PREFIX: terraform/infra

options:
  logging: CLOUD_LOGGING_ONLY
