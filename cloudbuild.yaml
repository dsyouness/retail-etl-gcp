steps:
  - name: hashicorp/terraform:1.6.6
    id: terraform-init
    dir: infra
    entrypoint: sh
    args:
      - -c
      - |
        terraform init \
          -backend-config="bucket=${_TF_STATE_BUCKET}" \
          -backend-config="prefix=${_TF_STATE_PREFIX}"

  - name: hashicorp/terraform:1.6.6
    id: terraform-plan
    dir: infra
    entrypoint: sh
    args:
      - -c
      - terraform plan -var="project_id=${PROJECT_ID}" -out=tfplan

  - name: hashicorp/terraform:1.6.6
    id: terraform-apply
    dir: infra
    entrypoint: sh
    args:
      - -c
      - terraform apply -auto-approve tfplan

substitutions:
  _TF_STATE_BUCKET: retail-etl-tfstate
  _TF_STATE_PREFIX: terraform/infra

options:
  logging: CLOUD_LOGGING_ONLY
